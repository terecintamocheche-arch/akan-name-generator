<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE AKAN NAME GENERATOR</title>
    <link href="style.css" rel="stylesheet">
</head>


<body>
    <h1>The Akan Name Generator</h1>
    

<div class="container">
        <p>Find your Akan name based on your birth date and gender.</p>



    <section id="form-section">
        <label>Day</label>
<input type="number" id="day" min="1" max="31">

<label>Month</label>
<input type="number" id="month" min="1" max="12">

<label>Year</label>
<input type="number" id="year">

<label>Gender</label>

<input type="radio" name="gender" value="male" id="male">
<label for="male">Male</label>

<input type="radio" name="gender" value="female" id="female">
<label for="female">Female</label>

<button type="button" onclick="generateName()">Generate Akan Name</button>

    </section>
    <div id="result-section">
        <h2>Your Akan Name</h2>
        <p id="result">Your name will appear here.</p>
    </div>
    <footer>
        <p>&copy; 2026 Terecinta Mocheche. All rights reserved.</p>
    </footer>
<script src="script.js"></script>
</body>
</html>
