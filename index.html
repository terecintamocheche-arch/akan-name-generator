<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE AKAN NAME GENERATOR</title>
</head>
<h1>The Akan name generator</h1>
<body>
    
<body>

        <p>Find your Akan name based on your birth date and gender.</p>



    <section id="form-section">
        <h2>Enter Your Details</h2>

        <form id="akanForm">
            <label>Date:</label>
            <input type="number" id="day">

            <label>Month:</label>
            <input type="number" id="month">

            <label>Year:</label>
            <input type="number" id="year">

            <label>Gender:</label>
            <select id="gender">
                <option>Male</option>
                <option>Female</option>
            </select>

            <br><br>

            <button type="submit">Generate Name</button>
        </form>
    </section>

    <!-- Result -->
    <section id="result-section">
        <h2>Your Akan Name</h2>
        <p id="result">Your name will appear here.</p>
    </section>

</body>

    
</body>
</html>
